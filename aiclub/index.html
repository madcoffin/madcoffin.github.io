M5.5 20c1.1-4 3.4-6 6.5-6s5.4 2 6.5 6"/>`,money:`<rect ${c} x="4" y="6" width="16" height="12" rx="2"/><circle ${c} cx="12" cy="12" r="2.5"/>`,dashboard:`<rect ${c} x="4" y="4" width="7" height="7" rx="2"/><rect ${c} x="13" y="4" width="7" height="7" rx="2"/><rect ${c} x="4" y="13" width="7" height="7" rx="2"/><rect ${c} x="13" y="13" width="7" height="7" rx="2"/>`,feedback:`<path ${c} d="M5 6h14v10H9l-4 4V6zM9 10h6M9 13h4"/>`,book:`<path ${c} d="M5 5.5A2.5 2.5 0 017.5 3H20v16H7.5A2.5 2.5 0 005 21.5v-16zM5 5.5A2.5 2.5 0 017.5 8H20"/>`,settings:`<circle ${c} cx="12" cy="12" r="3"/><path ${c} d="M12 3v3M12 18v3M4.8 6.8l2.1 2.1M17.1 17.1l2.1 2.1M3 12h3M18 12h3M4.8 17.2l2.1-2.1M17.1 6.9l2.1-2.1"/>`,notification:`<path ${c} d="M6 17h12l-1.5-2.2V11a4.5 4.5 0 00-9 0v3.8L6 17z"/><path ${c} d="M10 19a2 2 0 004 0"/>`};return `<svg viewBox="0 0 24 24">${m[n]||m.checklist}</svg>`}function ib(n,b=false){return `<span class="ico ${b?'brand':''}">${icon(n)}</span>`}function st(v,l){return `<div class="stat"><b>${v}</b><span>${l}</span></div>`}function go(r){history.replaceState(null,'',`#${r}`);document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===r));document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===r));window.scrollTo({top:0,behavior:'smooth'});if(r==='dashboard')renderDashboard()}function toast(m){let t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function renderHome(){document.querySelector('#home').innerHTML=`<section><div class="container hero"><div><span class="eyebrow">AI PRACTICAL GROWTH</span><h1>AI 실무 역량을 배우고,<span class="accent">결과물로 증명하세요.</span></h1><p class="lead">강의를 보는 데서 끝나지 않고, 매월 하나의 AI 실무 주제로 결과물을 만들고 피드백받는 커뮤니티 기반 멤버십입니다.</p><div class="cta"><button class="btn primary" data-route="challenge">이번 달 챌린지 참여하기 →</button><button class="btn" data-route="finder">내게 맞는 클럽 찾기</button></div><div class="stats">${st('4주','실무 챌린지')}${st('100명','베타 모집')}${st('1개','업무 산출물')}</div></div><div class="card challenge-card"><div class="challenge-head"><div style="display:flex;justify-content:space-between"><div><p class="kicker">THIS MONTH</p><h3 style="margin-top:8px;font-size:24px">AI로 내 업무 자동화하기</h3></div><span class="badge">Beta</span></div><div class="output"><span style="color:rgba(255,255,255,.65)">최종 산출물</span><b style="display:block;margin-top:6px;font-size:20px">업무 자동화 워크플로우 1개</b></div></div><div class="bodygrid">${[['calendar','기간','4주'],['user','대상','직장인 100명'],['money','가격','29,000원']].map(x=>`<div class="meta">${ib(x[0])}<div><span class="stat-label">${x[1]}</span><b>${x[2]}</b></div></div>`).join('')}<button class="btn primary" data-route="challenge">챌린지 상세 보기 →</button></div></div></div></section><section class="section darksec"><div class="container"><span class="eyebrow dark">WHY HANBIT AI CLUB</span><h2 class="title">AI 실무 적용, 콘텐츠 소비를 넘어 실행으로</h2><p class="lead">정보 제공을 넘어 실무 미션, 제출, 리뷰, 쇼케이스까지 하나의 흐름으로 연결합니다.</p><div class="grid g3" style="margin-top:36px">${[['prompt','정보는 많지만 적용이 어렵다','AI 도구와 강의는 많지만 내 업무에 어떻게 연결할지 막막합니다.'],['calendar','혼자서는 완주가 어렵다','동료, 마감, 피드백이 없으면 학습이 중간에 멈추기 쉽습니다.'],['dashboard','기업은 효과 측정이 어렵다','수료 여부보다 실제 업무 사례와 결과물이 필요합니다.']].map(x=>`<div class="darkcard">${ib(x[0],true)}<h3 class="card-title">${x[1]}</h3><p class="card-desc">${x[2]}</p></div>`).join('')}</div></div></section><section class="section"><div class="container center"><span class="eyebrow">HOW IT WORKS</span><h2 class="title">한 달에 하나의 주제, 하나의 실무 결과물</h2><p class="lead">강의, 미션, 제출, 피드백, 쇼케이스가 하나의 월간 사이클로 연결됩니다.</p><div class="grid g7" style="margin-top:36px">${D.steps.map((x,i)=>`<div class="step card">${ib(x[2],true)}<div class="step-no">0${i+1}</div><div class="step-title">${x[0]}</div><div class="step-desc">${x[1]}</div></div>`).join('')}</div></div></section><section class="section soft"><div class="container"><div class="split-head"><div><span class="eyebrow">MONTHLY PROGRAM</span><h2 class="title">다음 달에도 다시 참여하고 싶은 주제 설계</h2></div><button class="btn" data-route="challenge">전체 챌린지 보기</button></div><div class="grid g4">${D.themes.map(x=>`<div class="card theme-card">${ib(x[3],true)}<div class="kicker" style="margin-top:22px">${x[0]}</div><h3>${x[1]}</h3><p>결과물: ${x[2]}</p></div>`).join('')}</div></div></section>`}
function renderChallenge(){document.querySelector('#challenge').innerHTML=`<div class="content"><div class="container two"><section><span class="eyebrow">THIS MONTH CHALLENGE</span><h1 class="page-title">AI로 내 업무 자동화하기</h1><p class="lead">반복 업무를 찾아 AI 도구와 프롬프트를 활용해 자동화 워크플로우를 설계하는 4주 실습형 챌린지입니다.</p><div class="grid g4" style="margin-top:32px">${st('4주','진행 기간')}${st('100명','모집 인원')}${st('29,000원','베타 가격')}${st('입문~중급','난이도')}</div><section class="section-sm"><h2 class="title" style="font-size:32px">4주 커리큘럼</h2><div class="grid g2" style="margin-top:28px">${D.weeks.map(x=>`<div class="card"><div style="display:flex;gap:16px">${ib(x[4],true)}<div><div class="kicker">${x[0]}</div><h3 class="card-title" style="margin-top:8px">${x[1]}</h3><p class="card-desc">${x[3]}</p><div class="soft" style="margin-top:18px;padding:16px;font-weight:900">산출물: ${x[2]}</div></div></div></div>`).join('')}</div></section><section><h2 class="title" style="font-size:32px">제공 혜택</h2><div class="benefits" style="margin-top:28px">${['라이브 세션','주간 실습 미션','미션 템플릿','동료 피드백','멘토 리뷰 기회','우수 결과물 쇼케이스','수료 배지','한빛 추천 자료'].map(x=>`<div class="benefit"><span style="color:var(--brand);font-weight:950">✓</span>${x}</div>`).join('')}</div></section></section><aside class="sticky"><div class="price-panel"><div class="pricehead"><span style="color:rgba(255,255,255,.65)">결제 예정 금액</span><div class="price">29,000원</div><p style="margin-top:14px;color:rgba(255,255,255,.65);line-height:1.6">베타 정가 79,000원에서 29,000원으로 진행됩니다.</p></div><div style="padding:24px"><button class="btn primary block" data-route="pricing">멤버십 선택하고 신청</button><button class="btn block" style="margin-top:10px" data-route="finder">내게 맞는지 진단하기</button></div></div></aside></div></div>`}
function rec(){return state.answers.mode==='멘토 피드백까지'?'AI 업무 자동화 챌린지 + Mentor 멤버십':state.answers.mode==='결과물 제출까지'?'AI 업무 자동화 챌린지 + Pro 멤버십':state.answers.mode==='기업/팀 단위 참여'?'기업 AI 실무 챌린지':'AI 업무 자동화 챌린지 + Club 멤버십'}
function renderFinder(){const qs=[['role','1. 현재 직무는 무엇인가요?',['마케팅','기획/PM','개발','데이터 분석','교육/강의','기타']],['level','2. AI를 어느 정도 사용하고 있나요?',['거의 사용하지 않음','가끔 사용','업무에 일부 활용','적극 활용 중']],['problem','3. 가장 해결하고 싶은 문제는 무엇인가요?',['반복 업무 자동화','콘텐츠 제작','데이터 분석','서비스 기획','코딩/개발','보고서 작성']],['mode','4. 원하는 참여 방식은 무엇인가요?',['가볍게 참여','결과물 제출까지','멘토 피드백까지','기업/팀 단위 참여']]];const c=Object.values(state.answers).filter(Boolean).length;document.querySelector('#finder').innerHTML=`<div class="content"><div class="container two"><section><span class="eyebrow">FIND YOUR CLUB</span><h1 class="page-title">내게 맞는 클럽 찾기</h1><p class="lead">간단한 질문에 답하면 지금 가장 적합한 챌린지와 멤버십을 추천합니다.</p><div style="display:grid;gap:20px;margin-top:36px">${qs.map(q=>`<div class="question"><h3>${q[1]}</h3><div class="options">${q[2].map(o=>`<button class="opt ${state.answers[q[0]]===o?'selected':''}" data-answer-id="${q[0]}" data-answer-value="${o}">${o}</button>`).join('')}</div></div>`).join('')}</div></section><aside class="sticky"><div class="card"><div class="kicker">진단 진행률</div><div class="progress"><div class="bar" style="width:${c/4*100}%"></div></div><span class="stat-label">${c}/4 완료</span><div class="soft" style="padding:24px;margin-top:28px"><div class="kicker">추천 결과</div><h3 style="font-size:24px;margin-top:12px">${c===4?rec():'질문에 답하면 추천이 표시됩니다'}</h3>${c===4?'<p style="margin-top:12px;color:var(--muted)">예상 결과물: 업무 자동화 워크플로우 1개와 실무 적용 사례</p>':''}</div><button class="btn primary block" ${c<4?'disabled':''} data-route="pricing" style="margin-top:24px">추천 플랜 보기</button></div></aside></div></div>`}
function renderPricing(){document.querySelector('#pricing').innerHTML=`<div class="content"><div class="container"><span class="eyebrow">PRICING</span><h1 class="page-title">내 목표에 맞는 방식으로 참여하세요</h1><p class="lead">가볍게 시작하는 Free부터 멘토 피드백을 받을 수 있는 Mentor까지, 학습 목적과 몰입도에 따라 선택할 수 있습니다.</p><div class="plans">${D.plans.map(p=>`<div class="plan ${p[4]?'featured':''}"><div style="display:flex;justify-content:space-between"><div class="plan-name">${p[0]}</div>${p[4]?'<span class="badge">추천</span>':''}</div><div class="plan-price">${p[1]}</div><p class="plan-desc">${p[2]}</p><ul class="features">${p[3].map(f=>`<li>${f}</li>`).join('')}</ul><button class="btn ${p[4]?'':'primary'} block" data-plan="${p[0]}" style="margin-top:28px">선택하기</button></div>`).join('')}</div></div></div>`}
function renderDashboard(){const s=state.sub;document.querySelector('#dashboard').innerHTML=`<div class="content"><div class="container dash"><aside class="sidebar"><div class="profile"><div style="color:rgba(255,255,255,.65)">${state.plan} 멤버</div><b>송관님</b></div><div class="side">${[['dashboard','대시보드'],['checklist','내 챌린지'],['upload','미션 제출'],['feedback','피드백'],['trophy','쇼케이스'],['book','템플릿'],['settings','설정']].map((x,i)=>`<button class="${i===0?'active':''}">${icon(x[0])}${x[1]}</button>`).join('')}</div></aside><main class="main"><div class="dashhead"><div><h1>커뮤니티 대시보드</h1><p class="muted">현재 참여 중인 챌린지와 이번 주 미션을 확인하세요.</p></div><button class="btn primary">${icon('notification')} 알림 3개</button></div><div class="grid g4">${st('AI 업무 자동화','참여 중인 챌린지')}${st(s?'75%':'50%','내 진행률')}${st('D-3','제출 마감')}${st(s?'6개':'5개','받은 피드백')}</div><div class="dashgrid"><section class="card"><div style="display:flex;justify-content:space-between"><div><div class="kicker">이번 주 미션</div><h2 style="font-size:32px">프롬프트 작성</h2></div><span class="soft" style="padding:8px 14px;font-weight:950">2주차</span></div><p style="margin-top:18px;color:var(--muted);line-height:1.75">업무용 프롬프트 3개를 작성하고 실제 업무 결과와 함께 제출하세요.</p><div class="soft" style="border:1px solid var(--line);margin-top:24px;padding:22px"><h3>미션 제출 폼</h3><form id="mission-form" class="form"><input name="title" placeholder="결과물 제목" value="${s?.title||''}" required><textarea name="body" placeholder="업무 문제 설명, 사용한 AI 도구, 프롬프트, 배운 점을 작성하세요." required>${s?.body||''}</textarea><input name="link" placeholder="결과물 링크 URL" value="${s?.link||''}"><div class="upload">${icon('upload')} 파일 업로드 영역</div><button class="btn primary" type="submit">제출하기</button></form></div></section><aside><div class="card"><h3>최근 피드백</h3>${[['김민지','프롬프트 목적이 명확해서 바로 적용해볼 수 있겠어요.'],['멘토 박준형',s?'제출한 워크플로우가 좋아요.':'입력 데이터 예시를 추가하면 재현성이 더 좋아집니다.'],['이수현','저도 비슷한 업무가 있어 템플릿을 참고하고 싶습니다.']].map(x=>`<div class="feedback"><b>${x[0]}</b><p style="margin-top:6px;color:var(--muted)">${x[1]}</p></div>`).join('')}</div></aside></div></main></div></div>`}
function bind(){document.querySelectorAll('[data-route]').forEach(e=>e.onclick=()=>go(e.dataset.route));document.querySelectorAll('[data-answer-id]').forEach(e=>e.onclick=()=>{state.answers[e.dataset.answerId]=e.dataset.answerValue;localStorage.setItem(STORE.answers,JSON.stringify(state.answers));renderFinder();bind()});document.querySelectorAll('[data-plan]').forEach(e=>e.onclick=()=>{state.plan=e.dataset.plan;localStorage.setItem(STORE.plan,state.plan);toast(`${state.plan} 플랜이 선택되었습니다.`);go('dashboard')});let f=document.querySelector('#mission-form');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);state.sub={title:d.get('title'),body:d.get('body'),link:d.get('link')};localStorage.setItem(STORE.sub,JSON.stringify(state.sub));toast('미션이 제출되었습니다.');renderDashboard();bind()}}
function render(){renderHome();renderChallenge();renderFinder();renderPricing();renderDashboard();bind()}window.onhashchange=()=>{let r=location.hash.slice(1)||'home';if(['home','challenge','finder','pricing','dashboard'].includes(r))go(r)};render();go(location.hash.slice(1)||'home');
</script></body></html>
