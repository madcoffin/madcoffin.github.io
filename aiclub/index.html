<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 시대, 기술과 사람을 연결합니다. 배움 옆에, 한빛+</title>
  <meta name="description" content="AI 시대, 기술과 사람을 연결합니다." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <style>
    :root {
      --brand: #00A28A;
      --brand-dark: #008C78;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --soft: #f1f5f9;
      --dark: #020617;
      --white: #fff;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--white);
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: -0.015em;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }

    .container { max-width: var(--max); margin: 0 auto; padding: 0 24px; }
    .grid { display: grid; gap: 24px; }
    .grid-2 { grid-template-columns: 1.08fr .92fr; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-7 { grid-template-columns: repeat(7, 1fr); }

    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .nav-wrap { height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 0; text-align: left; }
    .brand-text { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .brand-logo { width: 44px; height: 44px; border: 1px solid var(--line); object-fit: cover; background: #fff; flex: 0 0 auto; }
    .brand-title { display: block; font-size: 18px; font-weight: 900; letter-spacing: -.025em; line-height: 1.15; white-space: nowrap; }
    .brand-sub { display: block; margin-top: 4px; font-size: 11px; font-weight: 800; letter-spacing: .16em; line-height: 1.15; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
    .nav { display: flex; align-items: center; gap: 28px; font-size: 14px; font-weight: 700; color: #475569; }
    .nav button { border: 0; background: none; font-weight: 700; color: inherit; padding: 6px 0; letter-spacing: -.01em; }
    .nav button.active, .nav button:hover { color: var(--brand); }
    .nav-actions { display: flex; gap: 8px; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 0 22px;
      border-radius: 0; border: 1px solid transparent;
      font-size: 14px; font-weight: 800;
      letter-spacing: -.01em;
      transition: .18s ease;
      white-space: nowrap;
    }
    .btn-primary { background: var(--brand); color: white; border-color: var(--brand); }
    .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
    .btn-secondary { background: white; color: var(--ink); border-color: #94a3b8; }
    .btn-secondary:hover { background: var(--soft); }
    .btn-dark { background: var(--dark); color: white; border-color: var(--dark); }
    .btn-light { background: white; color: var(--ink); border-color: white; }
    .btn-block { width: 100%; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .page { display: none; }
    .page.active { display: block; }
    .section { padding: 80px 0; }
    .section-sm { padding: 56px 0; }
    .hero { padding: 84px 0; background: white; }
    .hero-inner { border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      border-left: 4px solid var(--brand);
      background: var(--soft);
      padding: 6px 12px;
      font-size: 12px; font-weight: 800; letter-spacing: .16em;
      line-height: 1.25;
      color: #334155; text-transform: uppercase;
    }
    .eyebrow.dark { background: rgba(255,255,255,.08); color: white; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3, .hero-title, .page-title, .section-title, .card-title, .dash-title {
      letter-spacing: -0.045em;
      line-height: 1.15;
      font-weight: 900;
    }
    .hero-title { margin-top: 28px; max-width: 760px; font-size: clamp(38px, 5.4vw, 58px); line-height: 1.12; letter-spacing: -.055em; font-weight: 900; }
    .page-title { margin-top: 24px; max-width: 860px; font-size: clamp(34px, 4.4vw, 48px); line-height: 1.18; letter-spacing: -.05em; font-weight: 900; }
    .section-title { margin-top: 20px; font-size: clamp(28px, 3.6vw, 42px); line-height: 1.2; letter-spacing: -.045em; font-weight: 900; }
    .text-brand { color: var(--brand); display: block; }
    .lead { margin-top: 22px; max-width: 720px; color: var(--muted); font-size: 18px; line-height: 1.85; font-weight: 500; letter-spacing: -.02em; }
    .cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 32px; }

    .card { border: 1px solid var(--line); background: white; }
    .card.pad { padding: 28px; }
    .card-muted { background: var(--soft); }
    .card-dark { background: var(--dark); color: white; border-color: var(--dark); }
    .stat { border: 1px solid var(--line); background: white; padding: 20px; }
    .stat-value { font-size: 28px; line-height: 1.05; font-weight: 900; letter-spacing: -.035em; }
    .stat-label { margin-top: 8px; color: var(--muted); font-size: 14px; line-height: 1.45; font-weight: 600; }
    .stats { margin-top: 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 640px; }

    .challenge-card { overflow: hidden; }
    .challenge-head { background: var(--soft); border-bottom: 1px solid var(--line); padding: 26px; }
    .kicker { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .18em; line-height: 1.35; text-transform: uppercase; }
    .badge { display: inline-flex; align-items: center; background: var(--brand); color: white; padding: 5px 10px; font-size: 12px; font-weight: 800; line-height: 1.25; }
    .challenge-output { margin-top: 24px; background: var(--dark); color: white; padding: 20px; }
    .challenge-body { padding: 26px; display: grid; gap: 12px; }
    .meta-row { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); padding: 16px; background: white; }

    .icon-box { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 44px; height: 44px; border: 1px solid var(--line); color: var(--ink); background: white; }
    .icon-box.brand { border-color: var(--brand); background: var(--brand); color: white; }
    .icon-box svg { width: 21px; height: 21px; }

    .dark-section { background: var(--dark); color: white; }
    .dark-section .lead, .dark-section .muted { color: rgba(255,255,255,.64); }
    .dark-card { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.05); padding: 28px; }
    .muted { color: var(--muted); }
    .card-title { margin-top: 22px; font-size: 22px; font-weight: 900; letter-spacing: -.035em; line-height: 1.28; }
    .card-desc { margin-top: 14px; color: inherit; opacity: .72; font-size: 14px; line-height: 1.8; font-weight: 500; letter-spacing: -.01em; }
    .center { text-align: center; }
    .center .lead { margin-left: auto; margin-right: auto; }

    .step-card { border: 1px solid var(--line); background: white; padding: 20px; text-align: center; }
    .step-no { margin-top: 12px; color: #94a3b8; font-size: 12px; font-weight: 950; }
    .step-title { margin-top: 6px; font-weight: 800; line-height: 1.35; letter-spacing: -.02em; }
    .step-desc { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.65; font-weight: 500; }

    .split-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 40px; }
    .theme-card h3 { margin-top: 14px; font-size: 24px; line-height: 1.25; letter-spacing: -.035em; font-weight: 900; }
    .theme-card p { margin-top: 16px; color: var(--muted); font-size: 14px; line-height: 1.75; font-weight: 500; }

    .content-wrap { background: var(--soft); min-height: 600px; padding: 56px 0; }
    .two-col { display: grid; grid-template-columns: 1fr 390px; gap: 32px; align-items: start; }
    .sticky { position: sticky; top: 96px; }
    .benefits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .benefit { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); background: white; padding: 15px; font-size: 14px; line-height: 1.45; font-weight: 800; }

    .price-panel { overflow: hidden; border: 1px solid var(--line); background: white; }
    .price-head { background: var(--dark); color: white; padding: 28px; }
    .price { margin-top: 8px; font-size: 42px; font-weight: 950; }
    .price-body { padding: 24px; }

    .question { border: 1px solid var(--line); background: white; padding: 28px; }
    .option-grid { margin-top: 18px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .option { border: 1px solid var(--line); background: white; padding: 16px; text-align: left; font-size: 14px; font-weight: 900; }
    .option:hover, .option.selected { border-color: var(--brand); }
    .option.selected { background: var(--brand); color: white; }
    .progress { height: 12px; background: #e2e8f0; margin-top: 16px; }
    .progress-bar { height: 12px; background: var(--brand); width: 0%; transition: .2s; }

    .pricing-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 40px; }
    .plan { border: 1px solid var(--line); background: white; padding: 28px; }
    .plan.featured { background: var(--dark); border-color: var(--dark); color: white; }
    .plan-top { display: flex; align-items: center; justify-content: space-between; }
    .plan-name { font-size: 24px; line-height: 1.15; letter-spacing: -.035em; font-weight: 900; }
    .plan-price { margin-top: 24px; font-size: 34px; line-height: 1.05; letter-spacing: -.04em; font-weight: 900; }
    .plan-desc { margin-top: 14px; color: var(--muted); font-size: 14px; line-height: 1.8; font-weight: 500; }
    .plan.featured .plan-desc { color: rgba(255,255,255,.65); }
    .features { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; font-size: 14px; line-height: 1.55; font-weight: 600; }
    .features li::before { content: "✓"; color: var(--brand); margin-right: 8px; font-weight: 950; }

    .dashboard-wrap { display: flex; gap: 24px; align-items: flex-start; }
    .sidebar { width: 260px; flex: 0 0 auto; border: 1px solid var(--line); background: white; padding: 16px; position: sticky; top: 96px; }
    .profile { background: var(--dark); color: white; padding: 20px; margin-bottom: 16px; }
    .side-nav { display: grid; gap: 4px; }
    .side-nav button { display: flex; gap: 10px; align-items: center; border: 0; background: white; color: var(--muted); padding: 13px 14px; text-align: left; font-weight: 900; }
    .side-nav button svg { width: 17px; height: 17px; flex: 0 0 17px; }
    .side-nav button.active { background: var(--brand); color: white; }
    .dashboard-main { min-width: 0; flex: 1; }
    .dash-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    .dash-title { font-size: 40px; line-height: 1.18; font-weight: 900; letter-spacing: -.045em; }
    .dash-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 24px; margin-top: 24px; }
    .dashboard-main .btn svg { width: 16px; height: 16px; flex: 0 0 16px; }
    .dashboard-main .upload-zone svg { width: 18px; height: 18px; flex: 0 0 18px; }
    .form-grid { display: grid; gap: 12px; margin-top: 16px; }
    input, textarea { width: 100%; border: 1px solid var(--line); background: white; padding: 14px 16px; font-size: 14px; line-height: 1.6; font-weight: 500; outline: none; }
    input:focus, textarea:focus { border-color: var(--brand); }
    textarea { min-height: 110px; resize: vertical; }
    .upload-zone { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px dashed #94a3b8; background: white; padding: 20px; font-size: 14px; line-height: 1.45; font-weight: 800; color: var(--muted); }
    .feedback-item { background: var(--soft); padding: 16px; margin-top: 12px; }

    .footer-main { border-top: 1px solid #1e293b; background: var(--dark); color: white; padding: 48px 0; }
    .footer-bottom { border-top: 1px solid var(--line); background: var(--soft); padding: 20px 0; text-align: center; color: var(--muted); font-size: 12px; }

    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 100; background: var(--dark); color: white; padding: 14px 18px; font-weight: 800; display: none; }
    .toast.show { display: block; }

    @media (max-width: 980px) {
      .grid-2, .two-col, .dash-grid { grid-template-columns: 1fr; }
      .grid-3, .grid-4, .pricing-grid, .benefits { grid-template-columns: repeat(2, 1fr); }
      .grid-7 { grid-template-columns: repeat(2, 1fr); }
      .nav { display: none; }
      .sidebar { display: none; }
      .dashboard-wrap { display: block; }
      .sticky { position: static; }
    }
    @media (max-width: 640px) {
      .container { padding: 0 18px; }
      .nav-actions .btn-secondary { display: none; }
      .grid-3, .grid-4, .grid-7, .pricing-grid, .benefits, .stats, .option-grid { grid-template-columns: 1fr; }
      .hero { padding: 56px 0; }
      .section { padding: 56px 0; }
      .split-head { display: block; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <button class="brand" data-route="home" aria-label="메인으로 이동">
        <img class="brand-logo" src="https://scontent-icn2-1.xx.fbcdn.net/v/t39.30808-1/326548931_492943676327918_807320210422121388_n.png?_nc_cat=108&ccb=1-7&_nc_sid=2d3e12&_nc_ohc=qcn6MmV_Q70Q7kNvwHmDeyx&_nc_oc=AdqftIad9giWXoiu8uVo6oJUlgmmDCxPbcldKEQoOxmNcZXVrv7255NJvP37ScXFH7U&_nc_zt=24&_nc_ht=scontent-icn2-1.xx&_nc_gid=fwsfoYr_4uWnLW7ANzWvug&_nc_ss=7b2a8&oh=00_Af4oN7SLvVawT05RVmYY4MB_zTmFO-a6euP2nDUbe6wngw&oe=6A097501" alt="HanbitN logo" />
        <span class="brand-text"><span class="brand-title">한빛+</span><span class="brand-sub">AI Practical Community</span></span>
      </button>
      <nav class="nav" aria-label="주요 메뉴">
        <button data-route="home">메인</button>
        <button data-route="challenge">챌린지</button>
        <button data-route="finder">클럽 찾기</button>
        <button data-route="pricing">요금제</button>
        <button data-route="dashboard">대시보드</button>
      </nav>
      <div class="nav-actions">
        <button class="btn btn-secondary" data-route="dashboard">로그인</button>
        <button class="btn btn-primary" data-route="challenge">도입 문의</button>
      </div>
    </div>
  </header>

  <main>
    <section id="home" class="page active"></section>
    <section id="challenge" class="page"></section>
    <section id="finder" class="page"></section>
    <section id="pricing" class="page"></section>
    <section id="dashboard" class="page"></section>
  </main>

  <footer class="footer-main">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap;">
      <div>
        <div style="font-size:24px; font-weight:950;">한빛 AI 실무 클럽</div>
        <p style="margin-top:10px; color:rgba(255,255,255,.55); font-size:14px;">방문 → 진단 → 추천 → 신청 → 미션 수행 → 결과물 제출 → 피드백 → 재참여</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-light" data-route="challenge">베타 신청</button>
        <button class="btn btn-secondary" data-route="dashboard">로그인 체험</button>
      </div>
    </div>
  </footer>
  <footer class="footer-bottom">©2026 HanbitN Inc. All rights reserved.</footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEYS = {
      answers: "hanbit_ai_club_answers",
      plan: "hanbit_ai_club_plan",
      submission: "hanbit_ai_club_submission"
    };

    const state = {
      route: "home",
      answers: JSON.parse(localStorage.getItem(STORAGE_KEYS.answers) || "{}"),
      selectedPlan: localStorage.getItem(STORAGE_KEYS.plan) || "Pro",
      submission: JSON.parse(localStorage.getItem(STORAGE_KEYS.submission) || "null")
    };

    const DATA = {
      steps: [
        ["월간 테마", "실무 주제 선정", "calendar"],
        ["라이브 세션", "핵심 개념 학습", "play"],

        ["동료 피드백", "서로 리뷰", "community"],
        ["멘토 리뷰", "전문가 피드백", "mentor"],
        ["쇼케이스", "우수 사례 공개", "trophy"]
      ],
      themes: [
        ["1월", "AI로 업무 자동화", "반복 업무 자동화 워크플로우", "automation"],
        ["2월", "바이브 코딩", "AI로 만든 미니 업무 도구", "code"],
        ["3월", "AI 마케팅 콘텐츠", "콘텐츠 캘린더와 광고 카피", "marketing"],
        ["4월", "데이터 분석 자동화", "자동 요약 리포트와 대시보드", "analytics"]
      ],
      missionWeeks: [
        ["1주차", "문제 정의", "AI 적용 후보 리스트", "내 업무에서 자동화 가능한 반복 업무를 찾습니다.", "target"],
        ["2주차", "프롬프트 작성", "직무별 프롬프트 3개", "업무용 프롬프트를 설계하고 실제 업무에 테스트합니다.", "prompt"],
        ["3주차", "자동화 설계", "업무 자동화 프로세스", "AI 도구를 연결해 반복 업무 워크플로우를 구성합니다.", "workflow"],
        ["4주차", "결과 공유", "최종 업무 적용 사례", "완성한 결과물을 발표하고 동료·멘토 피드백을 받습니다.", "presentation"]
      ],
      plans: [
        { name: "Free", price: "0원", desc: "서비스를 가볍게 둘러보고 싶은 사용자", features: ["공개 아티클", "맛보기 미션", "뉴스레터", "일부 공개 세션"] },
        { name: "Club", price: "19,900원", desc: "월간 미션과 커뮤니티 참여를 원하는 실무자", features: ["월간 라이브 세션", "주간 실습 미션", "커뮤니티 참여", "템플릿·프롬프트 제공"] },
        { name: "Pro", price: "39,000원", desc: "결과물을 제출하고 쇼케이스까지 참여하는 핵심 플랜", featured: true, features: ["Club 전체 혜택", "결과물 제출", "우수 사례 리뷰 참여", "월말 쇼케이스", "수료 배지"] },
        { name: "Mentor", price: "99,000원+", desc: "멘토 피드백과 소그룹 세션이 필요한 고관여 사용자", features: ["Pro 전체 혜택", "멘토 피드백", "소그룹 세션", "포트폴리오 리뷰"] }
      ]
    };

    function icon(name) {
      const common = 'fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
      const map = {
        calendar: `<rect ${common} x="4" y="5" width="16" height="15" rx="2"/><path ${common} d="M8 3v4M16 3v4M4 10h16M8 14h3M13 14h3"/>`,

    function go(route) {
      state.route = route;

      document.querySelectorAll("[data-route]").forEach(b => b.classList.toggle("active", b.dataset.route === route));
      window.scrollTo({ top: 0, behavior: "smooth" });

      const submission = state.submission;
      document.getElementById("dashboard").innerHTML = `<div class="content-wrap"><div class="container dashboard-wrap"><aside class="sidebar"><div class="profile"><div style="color:rgba(255,255,255,.65); font-size:14px;">${state.selectedPlan} 멤버</div><div style="margin-top:6px; font-weight:950;">송관님</div></div><nav class="side-nav">${[["dashboard","대시보드"],["checklist","내 챌린지"],["upload","미션 제출"],["feedback","피드백"],["trophy","쇼케이스"],["book","템플릿"],["settings","설정"]].map(([i,l],idx) => `<button class="${idx===0 ? "active" : ""}">${icon(i)}${l}</button>`).join("")}</nav></aside><main class="dashboard-main"><div class="dash-head"><div><h1 class="dash-title">커뮤니티 대시보드</h1><p class="muted" style="margin-top:8px; font-weight:600;">현재 참여 중인 챌린지와 이번 주 미션을 확인하세요.</p></div><button class="btn btn-primary">${icon("notification")} 알림 3개</button></div><div class="grid grid-4"><div class="stat"><div class="stat-value">AI 업무 자동화</div><div class="stat-label">참여 중인 챌린지</div></div><div class="stat"><div class="stat-value">${submission ? "75%" : "50%"}</div><div class="stat-label">내 진행률</div></div><div class="stat"><div class="stat-value">D-3</div><div class="stat-label">제출 마감</div></div><div class="stat"><div class="stat-value">${submission ? "6개" : "5개"}</div><div class="stat-label">받은 피드백</div></div></div><div class="dash-grid"><section class="card pad"><div style="display:flex; justify-content:space-between; gap:16px;"><div><div class="kicker">이번 주 미션</div><h2 style="margin-top:8px; font-size:32px; font-weight:950; letter-spacing:-.03em;">프롬프트 작성</h2></div><span class="card-muted" style="align-self:start; padding:8px 14px; font-weight:950;">2주차</span></div><p style="margin-top:18px; color:var(--muted); line-height:1.75;">업무용 프롬프트 3개를 작성하고 실제 업무 결과와 함께 제출하세요. 피드백 받고 싶은 부분을 구체적으로 남기면 동료와 멘토 리뷰 품질이 좋아집니다.</p><div class="grid grid-3" style="margin-top:24px;">${["제출 가이드","참고 템플릿","우수 사례"].map(x => `<button class="card" style="padding:16px; font-weight:950; text-align:left;">${x}</button>`).join("")}</div><div class="card-muted" style="border:1px solid var(--line); margin-top:24px; padding:22px;"><h3>미션 제출 폼</h3><form id="mission-form" class="form-grid"><input name="title" placeholder="결과물 제목" value="${submission?.title || ""}" required /><textarea name="body" placeholder="업무 문제 설명, 사용한 AI 도구, 프롬프트, 배운 점을 작성하세요." required>${submission?.body || ""}</textarea><input name="link" placeholder="결과물 링크 URL" value="${submission?.link || ""}" /><div class="upload-zone">${icon("upload")} 파일 업로드 영역</div><button class="btn btn-primary" type="submit">제출하기</button></form></div></section><aside><div class="card pad"><h3 style="font-size:22px;">최근 피드백</h3>${[["김민지", "프롬프트 목적이 명확해서 바로 적용해볼 수 있겠어요."], ["멘토 박준형", submission ? "제출한 워크플로우가 좋아요. 입력 데이터 예시를 추가하면 더 완성도가 높아집니다." : "입력 데이터 예시를 추가하면 재현성이 더 좋아집니다."], ["이수현", "저도 비슷한 업무가 있어 템플릿을 참고하고 싶습니다."]].map(([n,t]) => `<div class="feedback-item"><strong>${n}</strong><p style="margin-top:6px; color:var(--muted); line-height:1.6;">${t}</p></div>`).join("")}</div><div class="card pad" style="margin-top:24px;"><h3 style="font-size:22px;">다음 라이브 세션</h3><div class="card-dark" style="padding:20px; margin-top:16px;"><div style="color:rgba(255,255,255,.65);">목요일 20:00</div><strong style="display:block; margin-top:6px;">업무 자동화 워크플로우 설계법</strong></div><button class="btn btn-secondary btn-block" style="margin-top:16px;">일정에 추가</button></div></aside></div></main></div></div>`;
    }

    function renderAll() {
      renderHome(); renderChallenge(); renderFinder(); renderPricing(); renderDashboard();
      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll("[data-route]").forEach(el => {
        el.addEventListener("click", () => go(el.dataset.route));
      });
      document.querySelectorAll("[data-answer-id]").forEach(el => {
        el.addEventListener("click", () => {
          state.answers[el.dataset.answerId] = el.dataset.answerValue;
          localStorage.setItem(STORAGE_KEYS.answers, JSON.stringify(state.answers));
          renderFinder(); bindEvents();
        });
      });
      document.querySelectorAll("[data-plan]").forEach(el => {
        el.addEventListener("click", () => {
          state.selectedPlan = el.dataset.plan;
          localStorage.setItem(STORAGE_KEYS.plan, state.selectedPlan);
          toast(`${state.selectedPlan} 플랜이 선택되었습니다.`);
          go("dashboard");
        });
      });
      const form = document.getElementById("mission-form");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const data = new FormData(form);
          state.submission = { title: data.get("title"), body: data.get("body"), link: data.get("link"), submittedAt: new Date().toISOString() };
          localStorage.setItem(STORAGE_KEYS.submission, JSON.stringify(state.submission));
          toast("미션이 제출되었습니다.");
          renderDashboard(); bindEvents();
        });
      }
    }

    window.addEventListener("hashchange", () => {
      const next = location.hash.replace("#", "") || "home";
      if (["home","challenge","finder","pricing","dashboard"].includes(next)) go(next);
    });

    renderAll();
    go(location.hash.replace("#", "") || "home");
  </script>
</body>
</html>
